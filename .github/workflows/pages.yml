name: Public Chromebook test build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:upstream
      - run: npm run setup:gui
      - run: npm test
      - run: npm run build:pages
      - run: npm ci --prefix stretch3-base/qa
      - run: ./stretch3-base/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Pages subpath smoke test
        env:
          BLOCK2SCRIPT_TEST_URL: http://127.0.0.1:5175/block2script/
        run: |
          node scripts/serve-pages.mjs &
          node stretch3-base/pages-smoke.test.mjs
          node stretch3-base/correspondence.test.mjs
          node stretch3-base/chromebook-priority-a.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
